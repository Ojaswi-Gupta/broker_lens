# ==============================================================================
# 1. STRICT AGENT EXECUTION PROTOCOL (HUMAN-IN-THE-LOOP PHASE GATING)
# ==============================================================================
agent_execution_protocol:
  execution_mode: "STRICT_SEQUENTIAL_PHASE_GATED"
  core_laws:
    - "LAW 1 (SINGLE PHASE EXECUTION): Never execute more than ONE phase per turn. Complete all tasks in the active phase, verify them, and immediately HALT."
    - "LAW 2 (MANDATORY PHASE GATE): At the end of every phase, output the structured Phase Gate Report defined below and wait for explicit human confirmation."
    - "LAW 3 (STATE PERSISTENCE): Keep this file saved at `prompts/master_workflow.yaml` and maintain a lightweight `prompts/phase_status.yaml` tracking completed phases, commit hashes, and user feedback."
    - "LAW 4 (ZERO DEAD BUTTONS & ZERO MOCK SHELLS): Every button, filter, tab, and action rendered in the UI must trigger real backend state changes or real client-side document viewer controls."
    - "LAW 5 (MEANINGFUL GIT HISTORY): Reviewers read the commit history. Make atomic, conventional commits (`feat:`, `fix:`, `test:`, `docs:`) during each phase rather than a single giant commit."
    - "LAW 6 (SECURITY & PRIVACY BY DESIGN): Never commit `.env` files, API keys, or real PII. Provide `.env.example` only."

  phase_gate_output_template: |
    ==========================================================================
    🛑 PHASE [X] COMPLETE: [Phase Title]
    ==========================================================================
    1. DELIVERABLES BUILT:
       - [List exact files created/modified and features implemented]
    2. VERIFICATION & TESTS EXECUTED:
       - [List commands run and pass/fail status]
    3. GIT COMMITS RECORDED:
       - [List commit hashes and messages created in this phase]
    4. NEXT PHASE PREVIEW:
       - Phase [X+1]: [Next Phase Title & 1-line summary]
    --------------------------------------------------------------------------
    👉 ACTION REQUIRED:
    Are you satisfied with Phase [X]?
    - Reply "APPROVE PHASE [X]" to proceed to Phase [X+1].
    - Or specify any changes/refinements you want made in Phase [X] first.
    ==========================================================================

# ==============================================================================
# 2. CLIENT BRIEF, DOMAIN CONTEXT & EXPLICIT ASSUMPTIONS
# ==============================================================================
client_brief:
  client_profile:
    entity: "Company A, Navi Mumbai (Nhava Sheva / JNPT Port)"
    business: "Freight forwarder and licensed Customs Broker (CHA)"
    scale: "85 total staff, ₹60-75 crore annual revenue, 14-member documentation team"
  current_workflow_pain:
    process: "Importers email Commercial Invoices, Packing Lists, and Bills of Lading (BoL) as PDFs, skewed scans, or photos. Documentation executives manually retype fields into an Excel checklist, then into customs filing software (ICEGATE/VisualIMPEX). Seniors resolve doubts over WhatsApp."
    quantified_loss:
      volume: "1,100 shipments/month (13,200 shipments/year)"
      manual_entry_cost: "1,100 shipments/mo * 0.75 hrs (45 mins) * 12 mos = 9,900 hrs/yr @ ₹350/hr = ₹34.65 lakh/year"
      error_and_demurrage_cost: "3% error rate (396 shipments/yr) forcing amended Bill of Entry (BoE) or port delay @ ₹9,000/case (amendment fees, demurrage, staff time) = ₹35.64 lakh/year"
      total_annual_bleed: "₹70.29 lakh/year"
  project_constraints_and_targets:
    budget_and_timeline: "₹7.5 lakh budget, 6-week delivery target"
    success_kpis:
      - "Cut processing time per shipment from 45 minutes to under 15 minutes (>66% reduction)"
      - "Achieve >= 95% field extraction accuracy benchmarked on 200 historical shipments"
      - "Halve amended Bills of Entry (from 3% to <= 1.5%) within 3 months"
    compliance_and_regulatory:
      - "Data Residency: Host in India (ap-south-1 Mumbai region architecture)"
      - "Privacy: Importer contact details (names, emails, phones, IEC/GSTIN) are protected under India's DPDP Act 2023 (implement PII masking toggle & role-based access log)"
      - "Confidentiality: Client unit prices are strictly confidential; AI provider must use Zero Data Retention (enterprise API policy, never trains on client documents)"
      - "Document Reality: Scans are frequently skewed (rotated 2-8 degrees) or bilingual (e.g., Mandarin/English from China, Swedish/English from Sweden)"
      - "Form Factor: Desktop-first high-density operational workbench, while remaining fully responsive and usable on mobile phones for managers on the move"
  out_of_scope:
    - "Direct live filing submission on the ICEGATE customs portal"
    - "Automated HSN classification discovery or customs duty/IGST calculation"
    - "External customer-facing shipment tracking portal"

  labeled_assumptions_for_tdd:
    - "ASSUMPTION-01 (Filing Software Export Layout): Since the client wants to keep their existing filing software, the CSV/Excel export implements both a standard Nhava Sheva Customs Filing Flat Layout (Header + Line Items + Container rows) and a 1-click Checklist Summary CSV."
    - "ASSUMPTION-02 (Confidence Thresholds): Fields extracted with AI confidence >= 0.85 are marked 'High Confidence' (Green); 0.65 to 0.84 are 'Low Confidence - Human Confirmation Required' (Amber); < 0.65 or unreadable pages trigger 'Manual Entry Required' (Red)."
    - "ASSUMPTION-03 (Tolerance Rules): Financial totals (Invoice Total vs Sum of Line Items) require 0.00% tolerance (exact match within 0.01 rounding). Gross/Net weights and package counts across Invoice, Packing List, and Bill of Lading require exact 0.0 kg match by default, flagging any discrepancy (such as 3120 kg vs 3165 kg in SHP-24811) as a blocking Cross-Check Failure until resolved with an audit reason."
    - "ASSUMPTION-04 (Role Workflow): Documentation Executives can upload documents, run AI extraction, edit/confirm low-confidence fields, resolve cross-checks with mandatory notes, and export standard verified shipments. Shipments where a failed cross-check was manually overridden or where invoice value exceeds USD 25,000 require Documentation Manager approval prior to export (managers can also approve/export any shipment and view supplier/field accuracy analytics)."
    - "ASSUMPTION-05 (Hybrid AI + Deterministic Fallback): The system integrates Google Gemini 2.5 Flash Vision API (configured for structured JSON schema output + confidence scoring) and includes a deterministic document parser fallback so the reviewer can test full extraction even without an active API key or when offline."

# ==============================================================================
# 3. SYSTEM ARCHITECTURE & TECH STACK SPECIFICATION
# ==============================================================================
architecture:
  pattern: "Decoupled API-First Monorepo (Clean Domain-Driven Layers)"
  directory_structure: |
    broker_lens/
    ├── prompts/
    │   ├── master_workflow.yaml
    │   └── phase_status.yaml
    ├── backend/
    │   ├── app/
    │   │   ├── main.py                 # FastAPI entrypoint, CORS, lifespan seed
    │   │   ├── config.py               # Pydantic Settings (.env loader)
    │   │   ├── database.py             # SQLAlchemy 2.0 engine (PostgreSQL / SQLite local)
    │   │   ├── models/                 # User, Shipment, Document, ExtractedField, LineItem, CrossCheck, AuditLog
    │   │   ├── schemas/                # Strict Pydantic v2 request/response & AI extraction schemas
    │   │   ├── services/
    │   │   │   ├── ai_extractor.py     # Vision LLM integration + skew/bilingual handling + fallback parser
    │   │   │   ├── crosscheck_engine.py# Deterministic 3-way validation across Invoice, PL, and BoL
    │   │   │   ├── export_service.py   # Customs filing CSV/XLSX generator & gatekeeper check
    │   │   │   ├── accuracy_service.py # Per-field & per-supplier accuracy aggregation
    │   │   │   └── pdf_seed_gen.py     # Generates realistic visual PDFs/scans (including skewed & bilingual)
    │   │   ├── api/
    │   │   │   ├── auth.py             # JWT auth + RBAC dependencies (Executive vs Manager)
    │   │   │   ├── shipments.py        # Shipment CRUD, status transitions, document upload
    │   │   │   ├── review.py           # Field edit, confidence confirmation, cross-check resolution
    │   │   │   ├── export.py           # Gatekept CSV export endpoint
    │   │   │   └── analytics.py        # Field & supplier accuracy metrics + audit log feed
    │   ├── tests/
    │   │   ├── test_crosscheck_engine.py
    │   │   ├── test_export_gatekeeper.py
    │   │   ├── test_rbac_and_security.py
    │   │   └── test_ai_fallback.py
    │   ├── requirements.txt
    │   └── .env.example
    ├── frontend/
    │   ├── src/
    │   │   ├── app/                    # Next.js 14+ App Router (6-8 focused screens)
    │   │   │   ├── login/              # Screen 1: Sign-in with 1-click Demo Role Switcher
    │   │   │   ├── shipments/          # Screen 2: Shipment Status List & KPI Bar
    │   │   │   ├── shipments/new/      # Screen 3: New Shipment & 3-Document Upload Dropzone
    │   │   │   ├── shipments/[id]/review/    # Screen 4 & 5: Split-Screen Document & Field Workbench + 3-Way Cross-Check Drawer
    │   │   │   ├── shipments/[id]/export/    # Screen 6: Customs Filing CSV/Excel Preview & Export Modal/View
    │   │   │   └── analytics/          # Screen 7: Manager Accuracy Report (Per-Field & Per-Supplier) + Audit History
    │   │   ├── components/             # Reusable minimalist UI components
    │   │   ├── lib/                    # API client, auth context, formatters
    │   │   └── types/                  # Strict TypeScript interfaces matching backend schemas
    │   ├── package.json
    │   └── .env.example
    ├── docs/
    │   └── TDD.md                      # Source for Technical Design Document (exported to PDF/DOCX)
    ├── deployment.md                   # Required submission deliverable #2
    ├── docker-compose.yml              # Optional 1-command stack runner
    └── README.md

  ui_ux_design_system:
    philosophy: "Swiss Industrial Utility — high-contrast typography, generous breathing room, zero decorative clutter, immediate visual hierarchy for anomalies."
    palette:
      background: "#F8FAFC (Slate-50) canvas with #FFFFFF pure white cards"
      text_primary: "#0F172A (Slate-900) for sharp legibility during 8-hour shifts"
      accent_primary: "#0F172A / #1E293B (Deep Maritime Slate) for primary actions"
      confidence_high: "#10B981 (Emerald-500 badge / #ECFDF5 bg) — AI Confidence >= 85%"
      confidence_low: "#F59E0B (Amber-500 border / #FFFBEB bg) — AI Confidence < 85% (Requires Confirmation)"
      crosscheck_fail: "#EF4444 (Rose-500 border / #FEF2F2 bg) — Cross-Check Mismatch or Unreadable Page"
    typography: "Inter for UI labels; JetBrains Mono (tabular-nums) for HSN codes, weights, quantities, prices, and container numbers."
    ergonomics:
      - "Split-Screen Review Workbench: Left 50% interactive Document Viewer (switch between Invoice, Packing List, Bill of Lading; Zoom In/Out; Rotate +/- 2° to 90° for skewed scans; Page selector). Right 50% Structured Field Tabs with inline 1-click 'Confirm' checkmarks."
      - "Clicking a field on the right highlights the corresponding section/document tab on the left."
      - "Export Button is visually locked with a live checklist tooltip showing exactly how many low-confidence fields or failed cross-checks remain unresolved."

