# ==============================================================================
# 5. SEQUENTIAL DEVELOPMENT PHASES (STOP AFTER EVERY PHASE)
# ==============================================================================
phases:

  # ----------------------------------------------------------------------------
  # PHASE 0: REPO INITIALIZATION, MONOREPO SCAFFOLDING & PROMPT PERSISTENCE
  # ----------------------------------------------------------------------------
  - phase_id: 0
    name: "Repository Setup, Scaffolding & Prompt Persistence"
    objective: "Initialize git repository linked to https://github.com/Ojaswi-Gupta/broker_lens.git, save this workflow prompt into prompts/master_workflow.yaml, create clean backend/ and frontend/ scaffolding, and configure .gitignore and .env.example."
    tasks:
      - "Verify git remote points to https://github.com/Ojaswi-Gupta/broker_lens.git (or initialize git and add remote origin)."
      - "Persist this complete YAML workflow into `prompts/master_workflow.yaml` and create `prompts/phase_status.yaml`."
      - "Create directory structure: `backend/`, `frontend/`, `docs/`, `prompts/`."
      - "Create root `.gitignore` excluding `node_modules/`, `.next/`, `__pycache__/`, `.venv/`, `*.db`, `.env`, `.DS_Store`."
      - "Create `backend/requirements.txt` (fastapi, uvicorn, sqlalchemy, pydantic, pydantic-settings, python-jose[cryptography], passlib[bcrypt], python-multipart, reportlab, pillow, google-genai, httpx, pytest) and `backend/.env.example`."
      - "Initialize `frontend/` with Next.js (TypeScript, Tailwind CSS, App Router, Lucide React) and `frontend/.env.example`."
    verification:
      - "Check `git status` and `git remote -v`."
      - "Confirm `prompts/master_workflow.yaml` exists and no secrets exist in tracked files."
    git_commit: "chore: initialize broker_lens monorepo structure and phase-gated workflow spec"
    stop_and_ask: true

  # ----------------------------------------------------------------------------
  # PHASE 1: DATABASE SCHEMA, DOMAIN MODELS, RBAC AUTH & DPDP PRIVACY LAYER
  # ----------------------------------------------------------------------------
  - phase_id: 1
    name: "Database Schema, Core Domain Models & Role-Based Authentication"
    objective: "Build the relational data model in SQLAlchemy + Pydantic v2 schemas, JWT authentication, RBAC for Documentation Executive vs Documentation Manager, and DPDP Act 2023 PII masking utilities."
    tasks:
      - "Implement `backend/app/database.py` supporting `DATABASE_URL` (PostgreSQL for cloud production, SQLite `./broker_lens.db` for zero-config local evaluation)."
      - "Create SQLAlchemy models in `backend/app/models/`:"
      - "  1. `User`: id, email, hashed_password, full_name, role (`DOCUMENTATION_EXECUTIVE` | `DOCUMENTATION_MANAGER`), created_at."
      - "  2. `Shipment`: id, shipment_code (`SHP-24811`), importer_name, importer_iec, importer_contact_pii, port_loading, port_discharge, supplier_name, status (`UPLOADED`, `EXTRACTING`, `NEEDS_REVIEW`, `CROSS_CHECK_FAILED`, `READY_FOR_APPROVAL`, `APPROVED`, `EXPORTED`), assigned_to, approved_by, entry_time_seconds, created_at, updated_at."
      - "  3. `ShipmentDocument`: id, shipment_id, doc_type (`INVOICE` | `PACKING_LIST` | `BILL_OF_LADING`), file_name, file_path, page_count, skew_angle_deg, is_unreadable, extraction_status, raw_ai_json."
      - "  4. `ExtractedField`: id, shipment_id, doc_type, field_key (e.g., `invoice_number`, `invoice_date`, `supplier_name`, `currency`, `incoterm`, `invoice_total`, `packages`, `gross_weight_kg`, `net_weight_kg`, `container_number`), field_label, extracted_value, current_value, confidence_score (0.0-1.0), is_low_confidence (bool), is_confirmed_by_human (bool), confirmed_by_user_id, confirmed_at."
      - "  5. `ShipmentLineItem`: id, shipment_id, doc_type, line_number, description, hsn_code, qty, unit, unit_price, line_total, confidence_score, is_confirmed."
      - "  6. `CrossCheckResult`: id, shipment_id, rule_code, rule_name, severity (`ERROR` | `WARNING`), status (`PASSED` | `FAILED` | `RESOLVED_BY_HUMAN`), invoice_val, packing_list_val, bol_val, discrepancy_delta, resolution_note, resolved_by_user_id, resolved_at."
      - "  7. `FieldEditHistory`: id, shipment_id, doc_type, field_key, supplier_name, original_ai_value, updated_human_value, ai_confidence, edited_by_user_id, edit_reason, timestamp (powers the accuracy report per field and supplier)."
      - "Implement `backend/app/api/auth.py` with `/api/auth/login`, `/api/auth/me`, and `/api/auth/demo-switch` for instant reviewer testing."
    verification:
      - "Run a quick pytest script verifying table creation, JWT token generation, and role enforcement."
    git_commit: "feat(backend): implement SQLAlchemy data model, RBAC auth, and audit history schema"
    stop_and_ask: true

  # ----------------------------------------------------------------------------
  # PHASE 2: REALISTIC CUSTOMS PDF GENERATOR & SAMPLE DATA SEEDER
  # ----------------------------------------------------------------------------
  - phase_id: 2
    name: "Synthetic Customs Document PDF Generator & Sample Data Seeder"
    objective: "Generate real, visually inspectable PDF/SVG documents for SHP-24811, SHP-24812, SHP-24813, and SHP-24814 (including bilingual headers and simulated scan skew) and seed the database automatically on startup."
    tasks:
      - "Build `backend/app/services/pdf_seed_gen.py` using ReportLab/Pillow to generate actual downloadable/viewable PDF files in `backend/static/docs/` for every seeded shipment:"
      - "  - `SHP-24811`: Commercial Invoice (`3120 kg`, `USD 6.80 * 2400 = USD 16,320`), Packing List (`3165 kg` with Mandarin/English bilingual subtitle), and Bill of Lading (`3165 kg`, Container `MSCU8492014`)."
      - "  - `SHP-24812`: Commercial Invoice (`Company C (Sweden)`, `180 * EUR 42.50 = EUR 7,650`, `1460 kg`, Swedish/English bilingual labels, simulated slight scan tilt), Packing List (`1460 kg`), and Bill of Lading (`1460 kg`)."
      - "  - `SHP-24813`: Complete verified shipment ready for immediate export."
      - "  - `SHP-24814`: Shipment with a low-legibility/blurry Packing List scan triggering the 'Unreadable Page -> Manual Entry' workflow."
      - "Build `backend/app/services/seeder.py` and hook it into FastAPI startup so a fresh clone immediately has demo users, 4 rich shipments, generated PDFs, extracted fields, cross-check results, and historical edit logs from 50+ simulated past shipments to populate the Supplier & Field Accuracy Report."
    verification:
      - "Verify PDF files are generated inside `backend/static/docs/` and served via FastAPI StaticFiles."
      - "Query seeded shipments and confirm exact match with client brief sample table (`SHP-24811` and `SHP-24812`)."
    git_commit: "feat(seed): add realistic customs PDF generator and sample data seeder for SHP-24811 and SHP-24812"
    stop_and_ask: true

  # ----------------------------------------------------------------------------
  # PHASE 3: VISION AI EXTRACTION ENGINE & UNREADABLE/FALLBACK HANDLER
  # ----------------------------------------------------------------------------
  - phase_id: 3
    name: "Vision AI Extraction Service, Confidence Scoring & Fallback Engine"
    objective: "Implement the AI extraction pipeline that reads uploaded PDFs/images, extracts structured customs fields + line items with per-field confidence scores, flags skewed or unreadable pages, and works seamlessly with or without an external API key."
    tasks:
      - "Build `backend/app/services/ai_extractor.py`:"
      - "  - Primary Mode: Uses Gemini Vision (`gemini-2.5-flash`) with strict Pydantic structured outputs to extract Parties (Exporter/Supplier, Importer/Consignee), Invoice No & Date, Currency, Incoterm, Line Items (Description, 8-digit HSN, Qty, Unit Price, Line Total), Packages, Gross Weight (kg), Net Weight (kg), and Container Numbers, returning a `confidence: float` (0.00 to 1.00) and `source_bbox_hint` per field."
      - "  - Fallback & Deterministic Mode: If `GEMINI_API_KEY` is not set or the user uploads a file in offline review mode, extracts text/layout via PDF parser + heuristic regex/template matcher so live uploads in the reviewer's browser still extract real data and assign realistic confidence scores."
      - "  - Unreadable / Corrupted Page Detection: If average page confidence < 0.45 or text density is near zero, marks `document.is_unreadable = True` and switches all fields for that document into `MANUAL_ENTRY_REQUIRED` state."
      - "Expose `POST /api/shipments/{id}/upload` and `POST /api/shipments/{id}/extract` endpoints."
    verification:
      - "Run unit tests in `backend/tests/test_ai_fallback.py` testing normal extraction, low-confidence flagging (< 0.85), and unreadable document fallback."
    git_commit: "feat(ai): implement vision extraction pipeline with per-field confidence and unreadable fallback"
    stop_and_ask: true

  # ----------------------------------------------------------------------------
  # PHASE 4: 3-WAY CROSS-CHECK ENGINE, HUMAN CONFIRMATION & EXPORT GATEKEEPER
  # ----------------------------------------------------------------------------
  - phase_id: 4
    name: "Deterministic 3-Way Cross-Check Engine, Audit Logging & Export Gatekeeper"
    objective: "Implement the core business logic: cross-checking numbers across Invoice, Packing List, and Bill of Lading, logging every human correction per field/supplier, and strictly blocking export until all anomalies are resolved."
    tasks:
